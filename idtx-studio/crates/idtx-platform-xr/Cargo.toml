[package]
name = "idtx-platform-xr"
description = "OpenXR lifecycle, stereo-view, input, haptics, and frame-budget contracts for IDTX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Real OpenXR path (propagates to the loader shim). Without it, HMD pose
# reads always return `None` (desktop-only mode).
pcvr = ["idtx-openxr-sys/pcvr"]
# Quest/Android standalone OpenXR path — the on-device parallel to `pcvr`.
# Propagates to the loader shim's `quest` feature (Vulkan graphics binding).
# This crate is graphics-API-agnostic (glam only), so the pose-setter cfgs it
# carries key on `any(feature = "pcvr", feature = "quest")`, not the target.
quest = ["idtx-openxr-sys/quest"]
# Deterministic mock runtime for tests + CI (propagates to the loader).
mock-xr = ["idtx-openxr-sys/mock-xr"]
# XR_EXT_hand_tracking: enables hand joint location on the pcvr path.
# Propagates to the loader shim so the extension is requested at instance
# creation time. Without this flag HandTracker always reports unsupported.
hand-tracking = ["idtx-openxr-sys/hand-tracking"]
# Hand-gesture recognition: enables the `gesture` module (detectors + a
# background recognition thread over std::sync::mpsc). Independent of pcvr so
# detectors can be unit-tested headlessly.
gesture-recognition = []
# Timing instrumentation for the gesture worker (per-frame process time +
# event counts). Diagnostic-only; implies `gesture-recognition`.
gesture-metrics = ["gesture-recognition"]

[dependencies]
glam.workspace = true
idtx-openxr-sys.workspace = true
thiserror.workspace = true

[lints]
workspace = true
