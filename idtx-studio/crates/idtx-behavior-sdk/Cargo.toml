[package]
name = "idtx-behavior-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "SDK crate that behavior authors depend on. Compiles to wasm32-unknown-unknown."

[lints]
workspace = true

[dependencies]
idtx-behavior-abi = { workspace = true }
idtx-behavior-macros = { workspace = true }
# Pinned exactly at the workspace level so guest math is bit-compatible
# with the host. See the ABI crate docs.
glam = { workspace = true }
# POD (de)serialisation of the wire types across the FFI buffer.
bytemuck = { workspace = true }
arrayvec = { version = "0.7", default-features = false, features = ["serde"] }
# Guest contracts remain allocator-free in generated standalone crates.
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.7", default-features = false }
base64 = { version = "0.23", default-features = false }
