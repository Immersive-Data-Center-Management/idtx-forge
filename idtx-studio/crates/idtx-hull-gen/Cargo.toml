[package]
name = "idtx-hull-gen"
description = "Convex-hull generation for IdtxCollisionAPI hull colliders (editor-only authoring)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Convex-hull generation for the `IdtxCollisionAPI` `shape = hull` collider
# (conductor-only authoring). Pulls in `parry3d` (and `glam`) for the hull
# compute; the runtime player leaves it off so it never links them. Without it,
# only the lightweight `HullParams`/`HullResult`/`HullError`/`decimate`
# scaffolding compiles.
hull-gen = ["dep:parry3d", "dep:glam"]
# Timing / count instrumentation for the convex-hull compute path (the one
# performance-heavy step in `hull-gen`). Logs via `tracing`.
hull-metrics = ["hull-gen", "dep:tracing"]

[dependencies]
thiserror.workspace = true
glam = { workspace = true, optional = true }
parry3d = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
