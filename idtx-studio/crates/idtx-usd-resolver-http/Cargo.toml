[package]
name = "idtx-usd-resolver-http"
description = "OpenUSD ArResolver plugin: C++ facade + Rust HTTP fetcher for http/https URI schemes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

build = "build.rs"

[lints]
workspace = true

[features]
metrics = ["idtx-remote/metrics"]

[dependencies]
idtx-auth = { workspace = true }
idtx-net-guard = { workspace = true, features = ["client"] }
idtx-remote = { path = "../idtx-remote" }
reqwest.workspace = true
tempfile = "3"
thiserror.workspace = true
tracing.workspace = true

[build-dependencies]
anyhow.workspace = true
idtx-usd-build-support = { path = "../idtx-usd-build-support" }

[dev-dependencies]
idtx-usd = { path = "../idtx-usd" }
idtx-runtime-manifest.workspace = true
tiny_http = "0.12"
tracing-subscriber.workspace = true
