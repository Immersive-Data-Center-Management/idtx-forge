// Generated by idtx-build AndroidApkPackager (single-module app whose root is
// the staging directory itself). {{PACKAGE}} is substituted at package time.
// Real assembly is `gradle assembleRelease`, driven by xtask/CI, not in-editor.
plugins {
    id 'com.android.application'
}

android {
    namespace '{{PACKAGE}}'
    compileSdk 34

    defaultConfig {
        applicationId '{{PACKAGE}}'
        minSdk 30
        targetSdk 32
        versionCode 1
        versionName '1.0'
        ndk {
            // Quest is 64-bit ARM only.
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // The packager has already staged these into the module root.
            manifest.srcFile 'AndroidManifest.xml'
            jniLibs.srcDirs = ['jniLibs']
            assets.srcDirs = ['assets']
        }
    }

    buildTypes {
        release {
            // Native-only app; nothing to shrink. apksigner signs the output.
            minifyEnabled false
            signingConfig null
        }
    }
}
