[package]
name = "idtx-behavior-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Compiles a single-file behavior to wasm via an embedded cargo skeleton."

[lints]
workspace = true

[features]
metrics = []

[dependencies]
serde = { workspace = true }
serde_json.workspace = true
toml = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = "3"

[dev-dependencies]
wasmtime.workspace = true
# Native compile of the bundled single-file behaviors so their pure-math
# `#[cfg(test)]` units run under `cargo test` (the `#[behavior]` macro emits
# only the untouched impl off-wasm, so the sources include! cleanly).
idtx-behavior-sdk = { path = "../idtx-behavior-sdk" }
