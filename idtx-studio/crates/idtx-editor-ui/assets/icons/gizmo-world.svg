<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Globe ring (faint, conveys "world space") -->
  <circle cx="12" cy="12" r="8.5" fill="none" stroke="white" stroke-width="0.9" opacity="0.35"/>
  <!-- Equator (faint) -->
  <ellipse cx="12" cy="12" rx="8.5" ry="2.8" fill="none" stroke="white" stroke-width="0.9" opacity="0.35"/>

  <!-- Origin dot (world-aligned axes start lower-left) -->
  <circle cx="8" cy="16" r="1" fill="white"/>

  <!-- X axis — strictly horizontal right (world aligned) -->
  <line x1="8" y1="16" x2="17" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="19.5,16 17,14.75 17,17.25" fill="white"/>

  <!-- Y axis — strictly vertical up (world aligned) -->
  <line x1="8" y1="16" x2="8" y2="7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="8,4.5 6.75,7 9.25,7" fill="white"/>

  <!-- Z axis — isometric lower-left, slightly faded -->
  <line x1="8" y1="16" x2="3" y2="21" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
  <polygon points="1.5,22.5 3,20 5.5,21.5" fill="white" opacity="0.55"/>
</svg>
