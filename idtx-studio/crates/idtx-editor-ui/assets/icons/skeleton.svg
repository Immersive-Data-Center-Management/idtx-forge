<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Root joint (slightly larger to read as the root) -->
    <circle cx="12" cy="4" r="2.5"/>
    <!-- Spine bone -->
    <line x1="12" y1="6.5" x2="12" y2="10.2"/>
    <!-- Child joint -->
    <circle cx="12" cy="12.2" r="2"/>
    <!-- Left bone -->
    <line x1="10.6" y1="13.9" x2="6.5" y2="19"/>
    <!-- Right bone -->
    <line x1="13.4" y1="13.9" x2="17.5" y2="19"/>
    <!-- Left leaf joint -->
    <circle cx="5.5" cy="20.2" r="2"/>
    <!-- Right leaf joint -->
    <circle cx="18.5" cy="20.2" r="2"/>
  </g>
</svg>
