<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round">
    <!-- Capsule outline: top hemisphere + sides + bottom hemisphere -->
    <path d="M5 9 A7 7 0 0 1 19 9 L19 15 A7 7 0 0 1 5 15 Z"/>
    <!-- Top seam: front arc -->
    <path d="M5 9 A7 2.5 0 0 0 19 9"/>
    <!-- Top seam: back arc (hidden, dashed) -->
    <path d="M5 9 A7 2.5 0 0 1 19 9" stroke-dasharray="3 2"/>
    <!-- Bottom seam: front arc -->
    <path d="M5 15 A7 2.5 0 0 0 19 15"/>
    <!-- Bottom seam: back arc (hidden, dashed) -->
    <path d="M5 15 A7 2.5 0 0 1 19 15" stroke-dasharray="3 2"/>
  </g>
</svg>
