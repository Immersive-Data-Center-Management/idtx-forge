<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Origin dot -->
  <circle cx="11" cy="15" r="1" fill="white"/>

  <!-- X axis (right) -->
  <line x1="11" y1="15" x2="18.5" y2="15" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="21,15 18.5,13.5 18.5,16.5" fill="white"/>
  <!-- X label -->
  <text x="20.5" y="18" font-size="4.5" fill="white" font-family="sans-serif" font-weight="600">X</text>

  <!-- Y axis (up) -->
  <line x1="11" y1="15" x2="11" y2="5.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="11,3 9.5,5.5 12.5,5.5" fill="white"/>
  <!-- Y label -->
  <text x="8.5" y="2.5" font-size="4.5" fill="white" font-family="sans-serif" font-weight="600">Y</text>

  <!-- Z axis (lower-left, isometric depth) -->
  <line x1="11" y1="15" x2="5" y2="20.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="3,22 6,21.2 4.2,18.5" fill="white"/>
  <!-- Z label -->
  <text x="0.5" y="23" font-size="4.5" fill="white" font-family="sans-serif" font-weight="600">Z</text>
</svg>
