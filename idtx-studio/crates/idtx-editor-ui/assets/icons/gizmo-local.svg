<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Origin dot -->
  <circle cx="12" cy="14" r="1" fill="white"/>

  <!-- X axis (rotated ~30° up-right from horizontal — object local, not world aligned) -->
  <line x1="12" y1="14" x2="19" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="21.5,8.5 18.5,9.5 19.5,12.5" fill="white"/>

  <!-- Y axis (rotated ~30° left from vertical) -->
  <line x1="12" y1="14" x2="6" y2="6.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="4.5,4.5 5.5,7.5 8,5.5" fill="white"/>

  <!-- Z axis (depth, lower-right, slightly faded) -->
  <line x1="12" y1="14" x2="17" y2="20.5" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
  <polygon points="18.5,22.5 17.5,19.5 15,21" fill="white" opacity="0.55"/>
</svg>
