[package]
name = "idtx-project"
description = "Confined Conductor project, asset, and extension-lock model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# NOTE: `idtx-behavior` and `idtx-extension` are intentionally NOT depended on
# yet. They are needed only for the extension-lock model (a later L unit); and
# `idtx-extension` transitively pulls `idtx-usd` → `idtx-usd-sys`, which cannot
# build without a local OpenUSD install. Re-add them when the lock model lands.
[dependencies]
cap-std = "4.0.3"
idtx-runtime-manifest.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
