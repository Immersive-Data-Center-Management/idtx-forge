[workspace]

[package]
name = "signal-room-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[features]
usd = ["dep:idtx-usd", "dep:idtx-usd-extension"]

[dependencies]
idtx-project = { path = "../../../../crates/idtx-project" }
idtx-behavior = { path = "../../../../crates/idtx-behavior" }
idtx-behavior-build = { path = "../../../../crates/idtx-behavior-build" }
idtx-behavior-sdk = { path = "../../../../crates/idtx-behavior-sdk" }
idtx-usd = { path = "../../../../crates/idtx-usd", optional = true }
idtx-usd-extension = { path = "../../../../crates/idtx-usd-extension", optional = true }
