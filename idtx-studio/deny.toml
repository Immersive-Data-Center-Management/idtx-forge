[graph]
# Targets we care about for dependency resolution
targets = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
#    "BSD-2-Clause",
#    "BSD-3-Clause",
#    "ISC",
#    "Unicode-3.0",
#    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Exact-pinned crates — any semver bump is a hard error.
[[bans.deny]]
name = "glam"
version = "< 0.33.12"
reason = "WASM behavior host/guest ABI requires an exact glam pin; 0.33.12 is the floor glamx 0.3.1 (rapier/parry physics) needs (glam ^0.33.7)"

[[bans.deny]]
name = "glam"
version = "> 0.33.12"
reason = "WASM behavior host/guest ABI requires an exact glam pin; 0.33.12 is the floor glamx 0.3.1 (rapier/parry physics) needs (glam ^0.33.7)"

[[bans.deny]]
name = "naga"
version = "!= 29.0.4"
reason = "naga must match the copy vendored inside wgpu 29"

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
