name: Release Windows Bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-windows-bundle.yaml
    permissions:
      contents: read

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Flatten all three apps' zips into a single dist/ folder.
          merge-multiple: true

      - name: List bundles
        shell: pwsh
        run: Get-ChildItem dist -Filter '*-win64.zip' | ForEach-Object { Write-Host $_.Name }

      # On a version tag, publish every zip to a GitHub Release (creating the
      # release if it does not exist yet).
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}-windows"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
          Get-ChildItem dist -Filter '*-win64.zip' | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }