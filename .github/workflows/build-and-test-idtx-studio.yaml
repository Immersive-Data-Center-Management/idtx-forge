name: Build and Test idtx-studio

on:
  pull_request:

jobs:
  build:
    name: Build idtx-studio on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The OpenUSD build (on a cold cache) can take well over an hour.
    timeout-minutes: 180
    permissions:
      contents: read

    strategy:
      matrix:
        os: ["macos-latest", "windows-latest"]

    env:
      # Absolute install prefix shared by the OpenUSD builder (--install-dir)
      # and every downstream consumer (idtx-usd-sys/build.rs honours this var).
      # Matches `install_dir` in tools/build-scripts/openusd_config.toml.
      IDTX_USD_DIR: ${{ github.workspace }}/idtx-studio/thirdparty/openusd-26.11.1/install

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14' # stdlib tomllib for openusd_config.toml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android
          # rust-src: the behavior-build development_context test exercises the
          # live rust-analyzer scratch-workspace path (prepare_development),
          # which requires the std-library *sources*, not just the rlibs.
          components: clippy,rustfmt,rust-src

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: idtx-studio

      # The OpenUSD monolithic install is expensive to build but stable across
      # runs. Cache the install prefix keyed on the pinned version/config; the
      # build script reuses an existing install (lib + headers + version marker)
      # without rebuilding, so a cache hit makes the build step a fast no-op.
      - name: Cache OpenUSD install
        id: usd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: idtx-studio/thirdparty/openusd-26.11.1/install
          key: openusd-26.11.1-${{ matrix.os }}-${{ hashFiles('idtx-studio/tools/build-scripts/openusd_config.toml') }}

      # Multi-command gates use hosted Bash on both OSes so an early native
      # command failure cannot be hidden by a later successful command in pwsh.
      # Single-command steps retain the per-OS default shell.
      # Commands that need the install prefix use the `${{ env.… }}` expression
      # (expanded by Actions before the shell runs), so they stay shell-agnostic.
      - name: Build / reuse OpenUSD
        working-directory: idtx-studio
        run: python tools/build-scripts/build_openusd.py --install-dir "${{ env.IDTX_USD_DIR }}"

      - name: Build Workspace
        working-directory: idtx-studio
        run: cargo build --locked --workspace

      - name: Test Workspace
        working-directory: idtx-studio
        # Unit/integration test binaries link `usd_ms` transitively (via
        # idtx-usd-sys) but — unlike the bin targets, which bake a USD `lib/`
        # rpath in their own build.rs via `stage_usd_runtime()` — a downstream
        # *test* binary gets no such rpath (`rustc-link-arg` does not propagate
        # to dependents, and `rustc-link-arg-bins` skips tests). So on macOS the
        # loader can't find `@rpath/libusd_ms.dylib` before `main`. Point
        # DYLD at the USD install's lib dir, mirroring the convention the
        # USD-touching integration tests already document. macOS-only; empty
        # (harmless) on Windows, which instead copies the DLLs next to binaries.
        env:
          DYLD_LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && format('{0}/lib', env.IDTX_USD_DIR) || '' }}
        run: cargo test --workspace --tests -- --test-threads 1

      - name: HTTP resolver confinement and relative-dependency integration
        working-directory: idtx-studio
        env:
          DYLD_LIBRARY_PATH: ${{ matrix.os == 'macos-latest' && format('{0}/lib', env.IDTX_USD_DIR) || '' }}
        run: cargo test -p idtx-usd-resolver-http --test remote_open -- --ignored --test-threads 1

      
